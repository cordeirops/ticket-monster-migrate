name: OpenShift CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ticket-monster
          insecure_skip_tls_verify: true

      - name: Trigger Tekton Pipeline
        run: |
          oc create -f - <<EOF2
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            generateName: ticket-monster-run-
            namespace: ticket-monster
          spec:
            pipelineRef:
              name: ticket-monster-pipeline
            params:
            - name: GIT_URL
              value: https://github.com/cordeirops/ticket-monster-migrate
            - name: GIT_REVISION
              value: main
            workspaces:
            - name: source-code
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 500Mi
          EOF2

      - name: Wait and show PipelineRun status
        run: |
          sleep 10
          RUN=$(oc get pipelineruns -n ticket-monster \
            --sort-by='.metadata.creationTimestamp' \
            -o jsonpath='{.items[-1].metadata.name}')
          echo "PipelineRun: $RUN"
          oc wait pipelinerun/$RUN -n ticket-monster \
            --for=condition=Succeeded \
            --timeout=600s \
            && echo "Pipeline concluida com SUCESSO!" \
            || (echo "Pipeline FALHOU:" && \
                oc get pipelinerun/$RUN -n ticket-monster \
                  -o jsonpath='{.status.conditions[0].message}' && \
                exit 1)
