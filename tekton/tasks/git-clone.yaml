apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
  - name: url
    type: string
  - name: revision
    type: string
    default: main
  workspaces:
  - name: output
  steps:
  - name: clone
    image: alpine/git:latest
    script: |
      git clone $(params.url) /tmp/repo
      cp -r /tmp/repo/. $(workspaces.output.path)/
      cd $(workspaces.output.path)
      git checkout $(params.revision)
